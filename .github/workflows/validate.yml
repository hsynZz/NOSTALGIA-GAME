name: Offline C++ and repository checks (no Unreal build)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile shared production logic and run all offline tests
        run: python3 Scripts/validate.py --sanitize
